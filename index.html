<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0D0A08">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>往来账簿</title>
<style>
:root{--bg:#0D0A08;--surf:#171310;--surf2:#201A15;--ink:#F4EFE6;--ink2:#ABA398;--ink3:#8C847A;
--line:rgba(244,239,230,.13);--line2:rgba(244,239,230,.07);--out:#F26A2D;--in:#63B79A;
--serif:"Songti SC","STSong","Source Han Serif SC","Noto Serif SC",Georgia,serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
--r:18px;--shadow:0 20px 40px -18px rgba(0,0,0,.85)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
font:15.5px/1.62 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;
font-variant-numeric:tabular-nums;padding:env(safe-area-inset-top) 0 calc(28px + env(safe-area-inset-bottom));
background-image:radial-gradient(130% 70% at 50% -12%,rgba(242,106,45,.07),transparent 58%)}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
header{position:sticky;top:0;z-index:9;background:rgba(13,10,8,.86);backdrop-filter:blur(14px);
border-bottom:1px solid var(--line2)}
header .in{max-width:560px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:10px}
header .t{font-family:var(--serif);font-size:16px;letter-spacing:.01em}
header .r{margin-left:auto;color:var(--ink3);font-size:11px;letter-spacing:.06em}
h2{font-size:11px;font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:var(--ink3);
margin:34px 0 12px;display:flex;align-items:center;gap:12px}
h2:after{content:"";flex:1;height:1px;background:var(--line2)}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 0}
.card{background:linear-gradient(180deg,rgba(244,239,230,.03),rgba(244,239,230,0) 45%),var(--surf);
border:1px solid var(--line2);border-radius:var(--r);padding:16px 17px;box-shadow:var(--shadow)}
.card .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.card .v{font-family:var(--serif);font-size:26px;margin-top:7px;white-space:nowrap;letter-spacing:-.02em}
.card.o .v{color:var(--out)}.card.i .v{color:var(--in)}
.card.wide{grid-column:1/-1;background:linear-gradient(180deg,var(--surf2),var(--surf));
padding:22px 20px 20px}
.card.wide .v{font-size:46px;letter-spacing:-.045em;line-height:1.05}
.card .s{font-size:11.5px;color:var(--ink3);margin-top:6px;letter-spacing:.02em}
.artcard{border-radius:var(--r);overflow:hidden;margin:20px 0 0;box-shadow:var(--shadow);
aspect-ratio:4/3;border:1px solid var(--line2)}
.artcard img{width:100%;height:100%;object-fit:cover;display:block}
.rows{border-top:1px solid var(--line2)}
.row{display:flex;align-items:baseline;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line2);font-size:14.5px}
.row .l{color:var(--ink2);flex:0 0 auto}
.row .m{color:var(--ink3);font-size:11.5px;margin-left:auto}
.row .v{font-family:var(--mono);min-width:92px;text-align:right;font-size:13.5px}
.row .v.o{color:var(--out)}.row .v.i{color:var(--in)}.row .v.z{color:var(--ink3)}
.hd{color:var(--ink3);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
display:flex;gap:10px;padding:8px 2px}
.hd span:first-child{flex:1}.hd .v{min-width:92px;text-align:right;font-family:inherit}
button{font:inherit;color:var(--ink);background:var(--surf);border:1px solid var(--line2);
border-radius:14px;padding:14px 16px;width:100%;display:flex;align-items:center;
justify-content:space-between;cursor:pointer;transition:background .2s,border-color .2s}
button:active{background:var(--surf2)}
button .c{color:var(--ink3);font-size:11.5px;letter-spacing:.06em}
.det{display:none}.det.on{display:block}
.note{color:var(--ink3);font-size:11.5px;line-height:1.95;margin-top:20px;letter-spacing:.02em}
.li{display:flex;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line2);font-size:14px;align-items:baseline}
.li .d{color:var(--ink3);font-size:11px;flex:0 0 76px;font-family:var(--mono)}
.li .n{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .a{min-width:88px;text-align:right;font-family:var(--mono);font-size:13.5px}
.li .a.o{color:var(--out)}.li .a.i{color:var(--in)}
.li.rf{opacity:.42}.li.rf .a{text-decoration:line-through}
/* 口令门 */
#gate{max-width:400px;margin:0 auto;padding:20vh 24px 0}
#gate .kick{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink3);margin-bottom:14px}
#gate h1{font-family:var(--serif);font-size:40px;font-weight:400;letter-spacing:-.02em;margin:0 0 12px;line-height:1.1}
#gate p{color:var(--ink3);font-size:12.5px;margin:0 0 30px;line-height:1.85}
#pw{width:100%;font:inherit;font-size:16px;padding:14px 15px;border-radius:2px;border:1px solid var(--line);
background:rgba(244,239,230,.03);color:var(--ink);letter-spacing:.14em;
outline:none;transition:border-color .2s,background .2s}
#pw::placeholder{color:var(--ink3);letter-spacing:.1em}
#pw:focus{border-color:var(--ink2);background:rgba(244,239,230,.06)}
#go{margin-top:10px;background:var(--ink);color:#0D0A08;border:1px solid var(--ink);
justify-content:center;font-weight:600;border-radius:2px;letter-spacing:.1em;font-size:13.5px}
#go:active{background:#fff}
#msg{margin-top:14px;font-size:12.5px;color:var(--out);min-height:18px}
#meter{height:1px;background:var(--line2);margin-top:16px;overflow:hidden}
#meterI{height:100%;width:0;background:var(--ink);transition:width .2s}
.accts{border-top:1px solid var(--line2)}
.arow{padding:12px 2px;border-bottom:1px solid var(--line2)}
.ahead{display:flex;align-items:baseline;gap:10px}
.an{font-size:14px;color:var(--ink);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aip{font-family:var(--serif);font-size:17px;letter-spacing:-.01em;white-space:nowrap;color:var(--in)}
.ameta{margin-top:3px;font-size:11.5px;color:var(--ink3);letter-spacing:.02em}
.arow.stale .an,.arow.stale .ameta{color:var(--ink3)}
.arow.stale .aip{color:var(--ink3);text-decoration:line-through;text-decoration-thickness:1px}
.lg{font-style:normal;font-size:10px;letter-spacing:.08em;color:var(--ink3);border:1px solid var(--line2);
border-radius:3px;padding:1px 4px;margin-left:4px;vertical-align:1px}
.focus{margin-top:10px;padding:11px 13px;border:1px solid var(--line2);border-radius:12px;
background:rgba(99,183,154,.07);font-size:12.5px;color:var(--ink2);line-height:1.6}
.focus b{color:var(--in);font-weight:600}
.hide{display:none!important}
</style>
</head>

  <h1>往来账簿</h1>
  <p>输入口令查看。<br>口令只在你手机里算，不发送、不保存。</p>

        const incrementalSMix = function() {

                    Bi = i0 * 32 * r;

                    arraycopy(B, Bi, XY, 0, Yi);                       // ROMix - 1

                    state = 1;                                         // Move to ROMix 2
                    i1 = 0;

                    // Fall through

                case 1:

                    // Run up to 1000 steps of the first inner smix loop
                    steps = N - i1;
                    if (steps > limit) { steps = limit; }
                    for (let i = 0; i < steps; i++) {                  // ROMix - 2
                        arraycopy(XY, 0, V, (i1 + i) * Yi, Yi)         // ROMix - 3
                        blockmix_salsa8(XY, Yi, r, x, _X);             // ROMix - 4
                    }

                    // for (var i = 0; i < N; i++)
                    i1 += steps;
                    currentOp += steps;

                    if (callback) {
                        // Call the callback with the progress (optionally stopping us)
                        const percent10 = parseInt(1000 * currentOp / totalOps);
                        if (percent10 !== lastPercent10) {
                            stop = callback(null, currentOp / totalOps);
                            if (stop) { break; }
                            lastPercent10 = percent10;
                        }
                    }

                    if (i1 < N) { break; }

                    i1 = 0;                                          // Move to ROMix 6
                    state = 2;

                    // Fall through

                case 2:

                    // Run up to 1000 steps of the second inner smix loop
                    steps = N - i1;
                    if (steps > limit) { steps = limit; }

                        blockmix_salsa8(XY, Yi, r, x, _X);           // ROMix - 9 (outer)
                    }

                    // for (var i = 0; i < N; i++)...
                    i1 += steps;
                    currentOp += steps;

                    // Call the callback with the progress (optionally stopping us)
                    if (callback) {
                        const percent10 = parseInt(1000 * currentOp / totalOps);
                        if (percent10 !== lastPercent10) {
                            stop = callback(null, currentOp / totalOps);
                            if (stop) { break; }
                            lastPercent10 = percent10;
                        }
                    }

                    if (i1 < N) { break; }

                    arraycopy(XY, 0, B, Bi, Yi);                     // ROMix - 10

                    // for (var i = 0; i < p; i++)...
                    i0++;
                    if (i0 < p) {
                        state = 0;
                        break;
                    }

                    b = [];
                    for (let i = 0; i < B.length; i++) {
                        b.push((B[i] >>  0) & 0xff);
                        b.push((B[i] >>  8) & 0xff);
                        b.push((B[i] >> 16) & 0xff);
                        b.push((B[i] >> 24) & 0xff);
                    }

                    const derivedKey = PBKDF2_HMAC_SHA256_OneIter(password, b, dkLen);

                    // Send the result to the callback
                    if (callback) { callback(null, 1.0, derivedKey); }

        scrypt: function(password, salt, N, r, p, dkLen, progressCallback) {

<script>
const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const fmt = n => (n < 0 ? '−' : '') + Math.abs(n).toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2});
const esc = s => String(s == null ? '' : s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const WAY = {wechat:'微信', alipay:'支付宝', bank:'银行卡', cash:'现金', other:'其它'};
const PACK_TEXT = $('pack').textContent.trim();
const r2 = n => Math.round(n * 100) / 100;

async function decryptPack(packText, pw, onProgress){
  const lines = packText.split('\n').map(s => s.trim()).filter(Boolean);
  const H = JSON.parse(lines[0]);
  const ct = b64(lines[1]);
  if(!(window.crypto && crypto.subtle)) throw new Error('这个浏览器不支持本地解密，换 Chrome / Safari 最新版打开');
  const keyBytes = await scrypt.scrypt(new TextEncoder().encode(pw), b64(H.salt), H.n, H.r, H.p, 32, onProgress);
  const key = await crypto.subtle.importKey('raw', keyBytes, 'AES-GCM', false, ['decrypt']);
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv: b64(H.nonce)}, key, ct));
}
function untar(u8){
  const dec = new TextDecoder(), files = {}; let off = 0;
  while(off + 512 <= u8.length){
    const name = dec.decode(u8.subarray(off, off + 100)).replace(/\0.*$/, '').trim();
    const size = parseInt(dec.decode(u8.subarray(off + 124, off + 136)).replace(/\0.*$/, '').trim(), 8) || 0;
    if(name) files[name.replace(/^\.\//, '')] = u8.subarray(off + 512, off + 512 + size);
    off += 512 + Math.ceil(size / 512) * 512;
  }
  return files;
}

function aggregate(rows){
  rows.sort((a,b) => (a.date + (a.time||'')).localeCompare(b.date + (b.time||'')));
  const live = rows.filter(r => !r.refunded), ref = rows.filter(r => r.refunded);
  const S = a => r2(a.reduce((s,x) => s + x.amount, 0));
  const O = S(live.filter(r => r.dir === 'out')), I = S(live.filter(r => r.dir === 'in'));
  const byYear = {}, byWay = {};
  live.forEach(r => {
    const y = r.date.slice(0,4);
    (byYear[y] = byYear[y] || {out:0,in:0,n:0})[r.dir] += r.amount; byYear[y].n++;
    const w = r.method || WAY[r.channel] || '其它';
    (byWay[w] = byWay[w] || {out:0,in:0,n:0})[r.dir] += r.amount; byWay[w].n++;
  });
  const grp = re => live.filter(r => re.test(r.note || ''));
  const sums = a => ({n:a.length, out:r2(a.filter(r=>r.dir==='out').reduce((s,r)=>s+r.amount,0)), in:r2(a.filter(r=>r.dir==='in').reduce((s,r)=>s+r.amount,0))});
  return {
    out:O, inn:I, net:r2(O-I), n:rows.length,
    nOut:live.filter(r=>r.dir==='out').length, nIn:live.filter(r=>r.dir==='in').length,
    refN:ref.length, refSum:S(ref), d0:rows[0].date, d1:rows[rows.length-1].date,
    byYear:Object.keys(byYear).sort().map(y=>({y, ...byYear[y], net:r2(byYear[y].out-byYear[y].in)})),
    byWay:Object.keys(byWay).sort((a,b)=>(byWay[b].out+byWay[b].in)-(byWay[a].out+byWay[a].in)).map(w=>({w, ...byWay[w], net:r2(byWay[w].out-byWay[w].in)})),
    hongbao:sums(grp(/红包|压岁|礼金|贺礼/)), birthday:sums(grp(/生日|寿|蛋糕/)),
    records:rows.map(r=>({date:r.date, time:r.time||'', dir:r.dir, amount:r.amount, note:r.note||'', way:r.method||WAY[r.channel]||'', refunded:!!r.refunded}))
  };
}

function draw(D, meta){

    + '<div class="card i"><div class="k">她给我</div><div class="v">' + fmt(D.inn) + '</div><div class="s">' + D.nIn + ' 笔</div></div>';
  $('years').innerHTML = '<div class="hd"><span>年份</span><span class="v">我给她</span><span class="v">她给我</span><span class="v">净额</span></div>'

      + '<span class="v o">' + fmt(y.out) + '</span><span class="v i">' + fmt(y.in) + '</span>'

  const g1 = D.hongbao.n ? '<div class="row"><span class="l">红包 / 礼金</span><span class="m">' + D.hongbao.n + ' 笔</span><span class="v o">' + fmt(D.hongbao.out) + '</span><span class="v i">' + fmt(D.hongbao.in) + '</span></div>' : '';
  const g2 = D.birthday.n ? '<div class="row"><span class="l">生日相关</span><span class="m">' + D.birthday.n + ' 笔</span><span class="v o">' + fmt(D.birthday.out) + '</span><span class="v i">' + fmt(D.birthday.in) + '</span></div>' : '';
  $('ways').innerHTML = D.byWay.map(w => '<div class="row"><span class="l">' + esc(w.w) + '</span><span class="m">' + w.n + ' 笔</span><span class="v o">' + fmt(w.out) + '</span><span class="v i">' + fmt(w.in) + '</span></div>').join('') + g1 + g2;
  $('det').innerHTML = '<div class="li" style="border-bottom-color:var(--line)"><span class="d">日期</span><span class="n">备注</span><span class="a">金额</span></div>'

      + '<span class="d">' + r.date.slice(2) + (r.time ? ' ' + r.time.slice(0,5) : '') + '</span>'
      + '<span class="n">' + esc(r.note || r.way || '—') + (r.refunded ? '（已退还）' : '') + '</span>'
      + '<span class="a ' + (r.dir === 'out' ? 'o' : 'i') + '">' + (r.dir === 'out' ? '给 ' : '收 ') + fmt(r.amount) + '</span></div>').join('');
  $('fold').firstChild.textContent = '展开 ' + D.n + ' 笔';
  $('foot').innerHTML = (D.refN ? '另有 ' + D.refN + ' 笔已退还 ¥' + fmt(D.refSum) + '，未计入上面三个数。<br>' : '')
    + '数据范围 ' + D.d0 + ' ~ ' + D.d1 + ' · 金额单位 元<br>'
    + '本页只有密文，口令在你这台设备上运算，不发送、不保存<br>生成于 ' + esc(meta.generated || '');
}

let INITED = false;

/* ---------- 她的近况（档案 + 三号属地轴，来自容器里的 alicia_dossier.json） ---------- */
const SEG = {douyin:'抖音 · 公开号', douyin_priv:'抖音 · 私密号', xhs:'小红书'};

const blk = (title, inner) => inner ? '<h2>' + title + '</h2><div class="rows">' + inner + '</div>' : '';

function renderDossier(d){
  const box = $('dossier');

  let h = '<div class="note" style="margin-top:0">档案打包于 <b>' + esc(d.generated || '') + '</b>'

        + '观测窗口 ' + esc(st.window || '—') + ' · 采样 ' + esc(st.samples || 0) + ' 次</div>';

  // 三源现状
  // 老档案里没有 stale/focus 字段（它们要等下次 relock 才写进去），
  // 所以在页面这一侧兜底算一遍：谁三天以上没动过，谁就是旧位置的残影。
  const heldDays = a => {
    // 优先用 since（"10-17 23:08"）现场算：档案是 relock 那一刻冻结的，
    // 直接用档案里的 held 会把"已持续 3 天"一直冻在那儿，越看越离谱。
    const raw = String(a.since || '');
    if (/^\d{4}-\d{2}-\d{2}T/.test(raw)) {
      const d0 = new Date(raw);
      if (!isNaN(d0)) return (Date.now() - d0.getTime()) / 86400000;
    }
    const m0 = raw.match(/^(\d{2})-(\d{2})\s+(\d{2}):(\d{2})$/);
    if (m0) {
      const now = new Date();
      let d = new Date(now.getFullYear(), +m0[1] - 1, +m0[2], +m0[3], +m0[4]);
      if (d > now) d = new Date(now.getFullYear() - 1, +m0[1] - 1, +m0[2], +m0[3], +m0[4]);
      return (now - d) / 86400000;
    }
    if (typeof a.held_h === 'number') return a.held_h;
    const s0 = String(a.held || '');
    let m = s0.match(/([\d.]+)\s*天/); if (m) return parseFloat(m[1]);
    m = s0.match(/([\d.]+)\s*小时/); if (m) return parseFloat(m[1]) / 24;
    m = s0.match(/([\d.]+)\s*分钟/); return m ? parseFloat(m[1]) / 1440 : 0;
  };
  const heldText = a => {
    const d = heldDays(a);
    if (d >= 1) return (Math.round(d * 10) / 10) + ' 天';
    const h = d * 24;
    if (h >= 1) return Math.round(h) + ' 小时';
    return Math.max(1, Math.round(h * 60)) + ' 分钟';
  };
  const staleOf = a => heldDays(a) >= 3;   // 永远按当前时间算，不吃档案里冻结的 stale

        + '<div class="ameta">自 ' + esc(hm(a.since)) + ' · 已 ' + esc(heldText(a)) + '</div>'
        + '</div>').join('')
    + '</div>'
    + (focus ? '<div class="focus">以最新变动的为准：' + esc(focus.name) + ' = <b>' + esc(focus.ip)
        + '</b>（' + esc(hm(focus.since)) + ' 起，已 ' + esc(heldText(focus)) + '）</div>' : '');

  // 行程（属地分段）
  let seg = '';
  Object.keys(d.segments || {}).forEach(col => {
    seg += '<div class="hd"><span>' + esc(SEG[col] || col) + '</span><span class="v">起</span><span class="v">止</span></div>';
    (d.segments[col] || []).forEach(s => {
      seg += '<div class="row"><span class="l">' + esc(s.v || '抓取失败') + '</span><span class="m"></span>'
           + '<span class="v z">' + esc(hm(s.from)) + '</span>'
           + '<span class="v z">' + esc(s.to ? hm(s.to) : '至今') + '</span></div>';
    });
  });
  h += blk('行程（观测到的属地区间）', seg);

  // 内容指纹
  const cnt = '<div class="row"><span class="l">公开号</span><span class="m">宇宙全糖</span>'
    + '<span class="v z">作品 ' + esc(c.pub_works || '—') + '</span><span class="v z">粉 ' + esc(c.pub_fans) + ' · 关 ' + esc(c.pub_following) + '</span></div>'
    + '<div class="row"><span class="l">私密号</span><span class="m">桂花落</span>'
    + '<span class="v z">' + esc(c.priv_tok || '—') + '</span><span class="v z">粉 ' + esc(c.priv_fans) + ' · 关 ' + esc(c.priv_following) + '</span></div>'
    + '<div class="row"><span class="l">小红书</span><span class="m">' + esc(c.xhs_last_ok || '') + '</span>'

  // 档案要点

  if(rd) h += '<h2>我的读法</h2><div class="rows">' + rd + '</div>';

  if(cv) h += '<div class="note">口径与陷阱：<br>' + cv + '</div>';

  box.innerHTML = h;
}

$('go').onclick = async () => {

    draw(aggregate(rows), meta);
    let dz = null;
    try { const dj = files['alicia_dossier.json']; if(dj) dz = JSON.parse(new TextDecoder().decode(dj)); } catch(e){}
    renderDossier(dz);
    $('gate').classList.add('hide'); $('app').classList.remove('hide');
    window.scrollTo(0,0);
    if(!INITED){ INITED = true;
      $('fold').onclick = () => { const d = $('det'); d.classList.toggle('on');
        $('fold').firstChild.textContent = (d.classList.contains('on') ? '收起 ' : '展开 ') + rows.length + ' 笔'; };
    }
  } catch(e) {
    $('meterI').style.width = '0%'; $('go').textContent = '打开';
    const nm = String((e && e.name) || ''), ms = String((e && e.message) || '');
    const wrong = /OperationError|InvalidAccess|crypto|subtle|decrypt|operation/i.test(nm + ' ' + ms);
    $('msg').textContent = wrong ? '口令不对，再试一次。' : ('打不开：' + (ms || nm || e));
  }
};
$('pw').addEventListener('keydown', e => { if(e.key === 'Enter') $('go').click(); });
(function(){
  try { const H = JSON.parse(PACK_TEXT.split('\n')[0]);
    $('gateFoot').innerHTML = '加密：scrypt(N=' + (H.n||'?') + ') + AES-256-GCM，页面里只有密文'
      + (H.hint ? '<br>口令提示：' + esc(H.hint) : '');
  } catch(e){}
})();
</script>
