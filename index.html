<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0A0A0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>往来账簿</title>
<style>
:root{--bg:#0A0A0C;--surf:#15171C;--surf2:#1C1F25;--ink:#F5F3EF;--ink2:#BDB8B1;--ink3:#8B867F;
--line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.055);--out:#FF7D68;--in:#63D6B6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;
font-variant-numeric:tabular-nums;padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom));
background-image:radial-gradient(120% 60% at 80% -8%,rgba(255,125,104,.06),transparent 60%),radial-gradient(90% 55% at 5% 2%,rgba(99,214,182,.045),transparent 62%);background-attachment:fixed}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:9;background:rgba(10,10,12,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line2)}
header .in{max-width:560px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;gap:10px}
header .t{font-size:15px;letter-spacing:.02em}
header .r{margin-left:auto;color:var(--ink3);font-size:11.5px}
h2{font-size:12.5px;font-weight:500;letter-spacing:.12em;color:var(--ink3);margin:26px 0 10px}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 0}
.card{background:var(--surf);border:1px solid var(--line2);border-radius:14px;padding:14px 15px}
.card .k{font-size:12.5px;color:var(--ink2)}
.card .v{font-size:24px;margin-top:5px;white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.card.o .v{color:var(--out)}.card.i .v{color:var(--in)}
.card.wide{grid-column:1/-1;background:linear-gradient(180deg,var(--surf2),var(--surf))}
.card.wide .v{font-size:34px;letter-spacing:-.02em}
.card .s{font-size:11.5px;color:var(--ink3);margin-top:4px}
.rows{border-top:1px solid var(--line2)}
.row{display:flex;align-items:baseline;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line2);font-size:14.5px}
.row .l{color:var(--ink2);flex:0 0 auto}
.row .m{color:var(--ink3);font-size:12px;margin-left:auto}
.row .v{font-variant-numeric:tabular-nums;min-width:92px;text-align:right}
.row .v.o{color:var(--out)}.row .v.i{color:var(--in)}.row .v.z{color:var(--ink3)}
.hd{color:var(--ink3);font-size:11.5px;display:flex;gap:10px;padding:6px 2px}
.hd span:first-child{flex:1}.hd .v{min-width:92px;text-align:right}
button{font:inherit;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;
display:flex;align-items:center;justify-content:space-between;cursor:pointer}
button .c{color:var(--ink3);font-size:12.5px}
.det{display:none}.det.on{display:block}
.note{color:var(--ink3);font-size:12px;line-height:1.8;margin-top:14px}
.li{display:flex;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line2);font-size:14px;align-items:baseline}
.li .d{color:var(--ink3);font-size:12px;flex:0 0 84px}
.li .n{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .a{min-width:88px;text-align:right;font-variant-numeric:tabular-nums}
.li .a.o{color:var(--out)}.li .a.i{color:var(--in)}
.li.rf{opacity:.45}.li.rf .a{text-decoration:line-through}
/* 口令门 */
#gate{max-width:400px;margin:0 auto;padding:22vh 20px 0;text-align:center}
#gate h1{font-size:19px;font-weight:400;letter-spacing:.02em;margin:0 0 6px}
#gate p{color:var(--ink3);font-size:12.5px;margin:0 0 22px;line-height:1.9}
#pw{width:100%;font:inherit;font-size:16px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);
background:var(--surf);color:var(--ink);text-align:center;letter-spacing:.06em}
#go{margin-top:12px;background:var(--ink);color:#0A0A0C;border:0;justify-content:center;font-weight:500;border-radius:12px}
#msg{margin-top:14px;font-size:13px;color:var(--out);min-height:20px}
#meter{height:2px;background:var(--line2);border-radius:2px;margin-top:16px;overflow:hidden}
#meterI{height:100%;width:0;background:var(--ink3);transition:width .2s}
.hide{display:none!important}
</style>
</head>
<body>
<div id="gate">
  <h1>往来账簿</h1>
  <p>输入口令查看<br>（口令只在你手机里算，不发送、不保存）</p>
  <input id="pw" type="password" inputmode="text" autocomplete="current-password" placeholder="口令">
  <button id="go">打开</button>
  <div id="meter"><div id="meterI"></div></div>
  <div id="msg" id2="msg"></div>
  <div id="gateFoot" style="margin-top:26px;color:var(--ink3);font-size:11.5px;line-height:1.9"></div>
</div>

<div id="app" class="hide">
  <header><div class="in"><span class="t">往来账簿</span><span class="r" id="cntTop"></span></div></header>
  <div class="wrap">
    <div class="big" id="big"></div>
    <h2>按年</h2><div class="rows" id="years"></div>
    <h2>按方式 / 类目</h2><div class="rows" id="ways"></div>
    <h2>全部明细</h2>
    <button id="fold"><span>展开</span><span class="c">日期 · 备注 · 金额</span></button>
    <div class="det" id="det"></div>
    <div class="note" id="foot"></div>
  </div>
</div>

        const outerKey = new Array(64);

        let i;
        let dk = [];

        // inner = (password ^ ipad) || salt || counter
        for (i = 0; i < 64; i++) { inner[i] = 0x36; }
        for (i = 0; i < password.length; i++) { inner[i] ^= password[i]; }
        for (i = 0; i < salt.length; i++) { inner[64 + i] = salt[i]; }
        for (i = innerLen - 4; i < innerLen; i++) { inner[i] = 0; }

        // outerKey = password ^ opad
        for (i = 0; i < 64; i++) outerKey[i] = 0x5c;
        for (i = 0; i < password.length; i++) outerKey[i] ^= password[i];

        // increments counter inside inner
        function incrementCounter() {
            for (let i = innerLen - 1; i >= innerLen - 4; i--) {
                inner[i]++;
                if (inner[i] <= 0xff) return;
                inner[i] = 0;
            }
        }

        // output blocks = SHA256(outerKey || SHA256(inner)) ...
        while (dkLen >= 32) {
            incrementCounter();
            dk = dk.concat(SHA256(outerKey.concat(SHA256(inner))));
            dkLen -= 32;
        }
        if (dkLen > 0) {
            incrementCounter();
            dk = dk.concat(SHA256(outerKey.concat(SHA256(inner))).slice(0, dkLen));
        }

        return dk;
    }

    // The following is an adaptation of scryptsy
    // See: https://www.npmjs.com/package/scryptsy
    function blockmix_salsa8(BY, Yi, r, x, _X) {
        let i;

        arraycopy(BY, (2 * r - 1) * 16, _X, 0, 16);
        for (i = 0; i < 2 * r; i++) {
            blockxor(BY, i * 16, _X, 16);
            salsa20_8(_X, x);
            arraycopy(_X, 0, BY, Yi + (i * 16), 16);
        }

        for (i = 0; i < r; i++) {
            arraycopy(BY, Yi + (i * 2) * 16, BY, (i * 16), 16);
        }

        for (i = 0; i < r; i++) {
            arraycopy(BY, Yi + (i * 2 + 1) * 16, BY, (i + r) * 16, 16);
        }
    }

    function R(a, b) {
        return (a << b) | (a >>> (32 - b));
    }

    function salsa20_8(B, x) {
        arraycopy(B, 0, x, 0, 16);

        for (let i = 8; i > 0; i -= 2) {
            x[ 4] ^= R(x[ 0] + x[12], 7);
            x[ 8] ^= R(x[ 4] + x[ 0], 9);
            x[12] ^= R(x[ 8] + x[ 4], 13);
            x[ 0] ^= R(x[12] + x[ 8], 18);
            x[ 9] ^= R(x[ 5] + x[ 1], 7);
            x[13] ^= R(x[ 9] + x[ 5], 9);
            x[ 1] ^= R(x[13] + x[ 9], 13);
            x[ 5] ^= R(x[ 1] + x[13], 18);
            x[14] ^= R(x[10] + x[ 6], 7);
            x[ 2] ^= R(x[14] + x[10], 9);
            x[ 6] ^= R(x[ 2] + x[14], 13);
            x[10] ^= R(x[ 6] + x[ 2], 18);
            x[ 3] ^= R(x[15] + x[11], 7);
            x[ 7] ^= R(x[ 3] + x[15], 9);
            x[11] ^= R(x[ 7] + x[ 3], 13);
            x[15] ^= R(x[11] + x[ 7], 18);
            x[ 1] ^= R(x[ 0] + x[ 3], 7);
            x[ 2] ^= R(x[ 1] + x[ 0], 9);
            x[ 3] ^= R(x[ 2] + x[ 1], 13);
            x[ 0] ^= R(x[ 3] + x[ 2], 18);
            x[ 6] ^= R(x[ 5] + x[ 4], 7);
            x[ 7] ^= R(x[ 6] + x[ 5], 9);
            x[ 4] ^= R(x[ 7] + x[ 6], 13);
            x[ 5] ^= R(x[ 4] + x[ 7], 18);
            x[11] ^= R(x[10] + x[ 9], 7);
            x[ 8] ^= R(x[11] + x[10], 9);
            x[ 9] ^= R(x[ 8] + x[11], 13);
            x[10] ^= R(x[ 9] + x[ 8], 18);
            x[12] ^= R(x[15] + x[14], 7);
            x[13] ^= R(x[12] + x[15], 9);
            x[14] ^= R(x[13] + x[12], 13);
            x[15] ^= R(x[14] + x[13], 18);
        }

        for (let i = 0; i < 16; ++i) {
            B[i] += x[i];
        }
    }

    // naive approach... going back to loop unrolling may yield additional performance
    function blockxor(S, Si, D, len) {
        for (let i = 0; i < len; i++) {
            D[i] ^= S[Si + i]
        }
    }

    function arraycopy(src, srcPos, dest, destPos, length) {
        while (length--) {
            dest[destPos++] = src[srcPos++];
        }
    }

    function checkBufferish(o) {
        if (!o || typeof(o.length) !== 'number') { return false; }

        for (let i = 0; i < o.length; i++) {
            const v = o[i];
            if (typeof(v) !== 'number' || v % 1 || v < 0 || v >= 256) {
                return false;
            }
        }

        return true;
    }

    function ensureInteger(value, name) {
        if (typeof(value) !== "number" || (value % 1)) { throw new Error('invalid ' + name); }
        return value;
    }

    // N = Cpu cost, r = Memory cost, p = parallelization cost
    // callback(error, progress, key)
    function _scrypt(password, salt, N, r, p, dkLen, callback) {

        N = ensureInteger(N, 'N');
        r = ensureInteger(r, 'r');
        p = ensureInteger(p, 'p');

        dkLen = ensureInteger(dkLen, 'dkLen');

        if (N === 0 || (N & (N - 1)) !== 0) { throw new Error('N must be power of 2'); }

        if (N > MAX_VALUE / 128 / r) { throw new Error('N too large'); }
        if (r > MAX_VALUE / 128 / p) { throw new Error('r too large'); }

        if (!checkBufferish(password)) {
            throw new Error('password must be an array or buffer');
        }
        password = Array.prototype.slice.call(password);

        if (!checkBufferish(salt)) {
            throw new Error('salt must be an array or buffer');
        }
        salt = Array.prototype.slice.call(salt);

        let b = PBKDF2_HMAC_SHA256_OneIter(password, salt, p * 128 * r);
        const B = new Uint32Array(p * 32 * r)
        for (let i = 0; i < B.length; i++) {
            const j = i * 4;
            B[i] = ((b[j + 3] & 0xff) << 24) |
                   ((b[j + 2] & 0xff) << 16) |
                   ((b[j + 1] & 0xff) << 8) |
                   ((b[j + 0] & 0xff) << 0);
        }

        const XY = new Uint32Array(64 * r);
        const V = new Uint32Array(32 * r * N);

        const Yi = 32 * r;

        // scratch space
        const x = new Uint32Array(16);       // salsa20_8
        const _X = new Uint32Array(16);      // blockmix_salsa8

        const totalOps = p * N * 2;
        let currentOp = 0;
        let lastPercent10 = null;

        // Set this to true to abandon the scrypt on the next step
        let stop = false;

        // State information
        let state = 0;
        let i0 = 0, i1;
        let Bi;

        // How many blockmix_salsa8 can we do per step?
        const limit = callback ? parseInt(1000 / r): 0xffffffff;

        // Trick from scrypt-async; if there is a setImmediate shim in place, use it
        const nextTick = (typeof(setImmediate) !== 'undefined') ? setImmediate : setTimeout;

        // This is really all I changed; making scryptsy a state machine so we occasionally
        // stop and give other evnts on the evnt loop a chance to run. ~RicMoo
        const incrementalSMix = function() {
            if (stop) {
                return callback(new Error('cancelled'), currentOp / totalOps);
            }

            let steps;

            switch (state) {
                case 0:
                    // for (var i = 0; i < p; i++)...
                    Bi = i0 * 32 * r;

                    arraycopy(B, Bi, XY, 0, Yi);                       // ROMix - 1

                    state = 1;                                         // Move to ROMix 2
                    i1 = 0;

                    // Fall through

                case 1:

                    // Run up to 1000 steps of the first inner smix loop
                    steps = N - i1;
                    if (steps > limit) { steps = limit; }
                    for (let i = 0; i < steps; i++) {                  // ROMix - 2
                        arraycopy(XY, 0, V, (i1 + i) * Yi, Yi)         // ROMix - 3
                        blockmix_salsa8(XY, Yi, r, x, _X);             // ROMix - 4
                    }

                    // for (var i = 0; i < N; i++)
                    i1 += steps;
                    currentOp += steps;

                    if (callback) {
                        // Call the callback with the progress (optionally stopping us)
                        const percent10 = parseInt(1000 * currentOp / totalOps);
                        if (percent10 !== lastPercent10) {
                            stop = callback(null, currentOp / totalOps);
                            if (stop) { break; }
                            lastPercent10 = percent10;
                        }
                    }

                    if (i1 < N) { break; }

                    i1 = 0;                                          // Move to ROMix 6
                    state = 2;

                    // Fall through

                case 2:

                    // Run up to 1000 steps of the second inner smix loop
                    steps = N - i1;
                    if (steps > limit) { steps = limit; }
                    for (let i = 0; i < steps; i++) {                // ROMix - 6
                        const offset = (2 * r - 1) * 16;             // ROMix - 7
                        const j = XY[offset] & (N - 1);
                        blockxor(V, j * Yi, XY, Yi);                 // ROMix - 8 (inner)
                        blockmix_salsa8(XY, Yi, r, x, _X);           // ROMix - 9 (outer)
                    }

                    // for (var i = 0; i < N; i++)...
                    i1 += steps;
                    currentOp += steps;

                    // Call the callback with the progress (optionally stopping us)
                    if (callback) {
                        const percent10 = parseInt(1000 * currentOp / totalOps);
                        if (percent10 !== lastPercent10) {
                            stop = callback(null, currentOp / totalOps);
                            if (stop) { break; }
                            lastPercent10 = percent10;
                        }
                    }

                    if (i1 < N) { break; }

                    arraycopy(XY, 0, B, Bi, Yi);                     // ROMix - 10

                    // for (var i = 0; i < p; i++)...
                    i0++;
                    if (i0 < p) {
                        state = 0;
                        break;
                    }

                    b = [];
                    for (let i = 0; i < B.length; i++) {
                        b.push((B[i] >>  0) & 0xff);
                        b.push((B[i] >>  8) & 0xff);
                        b.push((B[i] >> 16) & 0xff);
                        b.push((B[i] >> 24) & 0xff);
                    }

                    const derivedKey = PBKDF2_HMAC_SHA256_OneIter(password, b, dkLen);

                    // Send the result to the callback
                    if (callback) { callback(null, 1.0, derivedKey); }

                    // Done; don't break (which would reschedule)
                    return derivedKey;
            }

            // Schedule the next steps
            if (callback) { nextTick(incrementalSMix); }
        }

        // Run the smix state machine until completion
        if (!callback) {
            while (true) {
                const derivedKey = incrementalSMix();
                if (derivedKey != undefined) { return derivedKey; }
            }
        }

        // Bootstrap the async incremental smix
        incrementalSMix();
    }

    const lib = {
        scrypt: function(password, salt, N, r, p, dkLen, progressCallback) {
            return new Promise(function(resolve, reject) {
                let lastProgress = 0;
                if (progressCallback) { progressCallback(0); }
                _scrypt(password, salt, N, r, p, dkLen, function(error, progress, key) {

                        reject(error);

                            progressCallback(1);
                        }

                        return progressCallback(progress);
                    }

    if (typeof(exports) !== 'undefined') {
       module.exports = lib;

    // http://www.requirejs.org/docs/api.html
    // https://github.com/amdjs/amdjs-api/wiki/AMD
    } else if (typeof(define) === 'function' && define.amd) {

    } else if (root) {

        if (root.scrypt) {
            root._scrypt = root.scrypt;
        }

        root.scrypt = lib;

<script>
const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const fmt = n => (n < 0 ? '−' : '') + Math.abs(n).toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2});
const esc = s => String(s == null ? '' : s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const WAY = {wechat:'微信', alipay:'支付宝', bank:'银行卡', cash:'现金', other:'其它'};
const PACK_TEXT = $('pack').textContent.trim();
const r2 = n => Math.round(n * 100) / 100;

async function decryptPack(packText, pw, onProgress){
  const lines = packText.split('\n').map(s => s.trim()).filter(Boolean);
  const H = JSON.parse(lines[0]);
  const ct = b64(lines[1]);
  if(!(window.crypto && crypto.subtle)) throw new Error('这个浏览器不支持本地解密，换 Chrome / Safari 最新版打开');
  const keyBytes = await scrypt.scrypt(new TextEncoder().encode(pw), b64(H.salt), H.n, H.r, H.p, 32, onProgress);
  const key = await crypto.subtle.importKey('raw', keyBytes, 'AES-GCM', false, ['decrypt']);
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv: b64(H.nonce)}, key, ct));
}
function untar(u8){
  const dec = new TextDecoder(), files = {}; let off = 0;
  while(off + 512 <= u8.length){
    const name = dec.decode(u8.subarray(off, off + 100)).replace(/\0.*$/, '').trim();
    const size = parseInt(dec.decode(u8.subarray(off + 124, off + 136)).replace(/\0.*$/, '').trim(), 8) || 0;
    if(name) files[name.replace(/^\.\//, '')] = u8.subarray(off + 512, off + 512 + size);
    off += 512 + Math.ceil(size / 512) * 512;
  }
  return files;
}

function aggregate(rows){
  rows.sort((a,b) => (a.date + (a.time||'')).localeCompare(b.date + (b.time||'')));
  const live = rows.filter(r => !r.refunded), ref = rows.filter(r => r.refunded);
  const S = a => r2(a.reduce((s,x) => s + x.amount, 0));
  const O = S(live.filter(r => r.dir === 'out')), I = S(live.filter(r => r.dir === 'in'));
  const byYear = {}, byWay = {};
  live.forEach(r => {
    const y = r.date.slice(0,4);
    (byYear[y] = byYear[y] || {out:0,in:0,n:0})[r.dir] += r.amount; byYear[y].n++;
    const w = r.method || WAY[r.channel] || '其它';
    (byWay[w] = byWay[w] || {out:0,in:0,n:0})[r.dir] += r.amount; byWay[w].n++;
  });
  const grp = re => live.filter(r => re.test(r.note || ''));
  const sums = a => ({n:a.length, out:r2(a.filter(r=>r.dir==='out').reduce((s,r)=>s+r.amount,0)), in:r2(a.filter(r=>r.dir==='in').reduce((s,r)=>s+r.amount,0))});
  return {
    out:O, inn:I, net:r2(O-I), n:rows.length,
    nOut:live.filter(r=>r.dir==='out').length, nIn:live.filter(r=>r.dir==='in').length,
    refN:ref.length, refSum:S(ref), d0:rows[0].date, d1:rows[rows.length-1].date,
    byYear:Object.keys(byYear).sort().map(y=>({y, ...byYear[y], net:r2(byYear[y].out-byYear[y].in)})),
    byWay:Object.keys(byWay).sort((a,b)=>(byWay[b].out+byWay[b].in)-(byWay[a].out+byWay[a].in)).map(w=>({w, ...byWay[w], net:r2(byWay[w].out-byWay[w].in)})),
    hongbao:sums(grp(/红包|压岁|礼金|贺礼/)), birthday:sums(grp(/生日|寿|蛋糕/)),
    records:rows.map(r=>({date:r.date, time:r.time||'', dir:r.dir, amount:r.amount, note:r.note||'', way:r.method||WAY[r.channel]||'', refunded:!!r.refunded}))
  };
}

function draw(D, meta){
  const netWord = D.net > 0 ? '我多给的' : D.net < 0 ? '她多给的' : '已经打平';
  $('cntTop').textContent = D.n + ' 笔 · ' + D.d0.slice(0,7) + ' 起';
  $('big').innerHTML =
    '<div class="card wide"><div class="k">净额（' + netWord + '）</div><div class="v">¥ ' + fmt(Math.abs(D.net)) + '</div>'
    + '<div class="s">我给她 − 她给我</div></div>'
    + '<div class="card o"><div class="k">我给她</div><div class="v">' + fmt(D.out) + '</div><div class="s">' + D.nOut + ' 笔</div></div>'
    + '<div class="card i"><div class="k">她给我</div><div class="v">' + fmt(D.inn) + '</div><div class="s">' + D.nIn + ' 笔</div></div>';
  $('years').innerHTML = '<div class="hd"><span>年份</span><span class="v">我给她</span><span class="v">她给我</span><span class="v">净额</span></div>'
    + D.byYear.map(y => '<div class="row"><span class="l">' + y.y + '</span><span class="m">' + y.n + ' 笔</span>'
      + '<span class="v o">' + fmt(y.out) + '</span><span class="v i">' + fmt(y.in) + '</span>'
      + '<span class="v ' + (y.net > 0 ? 'o' : y.net < 0 ? 'i' : 'z') + '">' + fmt(y.net) + '</span></div>').join('');
  const g1 = D.hongbao.n ? '<div class="row"><span class="l">红包 / 礼金</span><span class="m">' + D.hongbao.n + ' 笔</span><span class="v o">' + fmt(D.hongbao.out) + '</span><span class="v i">' + fmt(D.hongbao.in) + '</span></div>' : '';
  const g2 = D.birthday.n ? '<div class="row"><span class="l">生日相关</span><span class="m">' + D.birthday.n + ' 笔</span><span class="v o">' + fmt(D.birthday.out) + '</span><span class="v i">' + fmt(D.birthday.in) + '</span></div>' : '';
  $('ways').innerHTML = D.byWay.map(w => '<div class="row"><span class="l">' + esc(w.w) + '</span><span class="m">' + w.n + ' 笔</span><span class="v o">' + fmt(w.out) + '</span><span class="v i">' + fmt(w.in) + '</span></div>').join('') + g1 + g2;
  $('det').innerHTML = '<div class="li" style="border-bottom-color:var(--line)"><span class="d">日期</span><span class="n">备注</span><span class="a">金额</span></div>'
    + D.records.slice().reverse().map(r => '<div class="li' + (r.refunded ? ' rf' : '') + '">'
      + '<span class="d">' + r.date.slice(2) + (r.time ? ' ' + r.time.slice(0,5) : '') + '</span>'
      + '<span class="n">' + esc(r.note || r.way || '—') + (r.refunded ? '（已退还）' : '') + '</span>'
      + '<span class="a ' + (r.dir === 'out' ? 'o' : 'i') + '">' + (r.dir === 'out' ? '给 ' : '收 ') + fmt(r.amount) + '</span></div>').join('');
  $('fold').firstChild.textContent = '展开 ' + D.n + ' 笔';
  $('foot').innerHTML = (D.refN ? '另有 ' + D.refN + ' 笔已退还 ¥' + fmt(D.refSum) + '，未计入上面三个数。<br>' : '')
    + '数据范围 ' + D.d0 + ' ~ ' + D.d1 + ' · 金额单位 元<br>'
    + '本页只有密文，口令在你这台设备上运算，不发送、不保存<br>生成于 ' + esc(meta.generated || '');
}

let INITED = false;
$('go').onclick = async () => {
  const pw = $('pw').value; if(!pw) return;
  $('msg').textContent = ''; $('go').textContent = '解密中…'; $('meterI').style.width = '0%';
  try {
    const tar = await decryptPack(PACK_TEXT, pw, p => { $('meterI').style.width = Math.round(p*100) + '%'; });
    const meta = JSON.parse(PACK_TEXT.split('\n')[0]);
    meta.generated = new Date().toLocaleString('zh-CN', {hour12:false});
    const files = untar(tar);
    const jl = files['alicia_ledger.jsonl'];
    if(!jl) throw new Error('容器里没有账簿数据');
    const rows = new TextDecoder().decode(jl).trim().split('\n').filter(Boolean).map(l => JSON.parse(l));
    draw(aggregate(rows), meta);
    $('gate').classList.add('hide'); $('app').classList.remove('hide');
    window.scrollTo(0,0);
    if(!INITED){ INITED = true;
      $('fold').onclick = () => { const d = $('det'); d.classList.toggle('on');
        $('fold').firstChild.textContent = (d.classList.contains('on') ? '收起 ' : '展开 ') + rows.length + ' 笔'; };
    }
  } catch(e) {
    $('meterI').style.width = '0%'; $('go').textContent = '打开';
    const nm = String((e && e.name) || ''), ms = String((e && e.message) || '');
    const wrong = /OperationError|InvalidAccess|crypto|subtle|decrypt|operation/i.test(nm + ' ' + ms);
    $('msg').textContent = wrong ? '口令不对，再试一次。' : ('打不开：' + (ms || nm || e));
  }
};
$('pw').addEventListener('keydown', e => { if(e.key === 'Enter') $('go').click(); });
(function(){
  try { const H = JSON.parse(PACK_TEXT.split('\n')[0]);
    $('gateFoot').innerHTML = '加密：scrypt(N=' + (H.n||'?') + ') + AES-256-GCM，页面里只有密文'
      + (H.hint ? '<br>口令提示：' + esc(H.hint) : '');
  } catch(e){}
})();
</script>
